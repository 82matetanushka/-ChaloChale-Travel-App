
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ITCART | Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    

<div class="container mt-3">
    <a href="asss1.html">Home</a>
</div>

<div class="card shadow p-3 mx-auto mt-5" style="width: 350px;">
    <h4 class="text-center">Registration</h4>

    <form>
        <label class="form-label">Username:</label>
        <input type="text" class="form-control mb-2" placeholder="Enter username" required>

        <label class="form-label">Email Id:</label>
        <input type="email" class="form-control mb-2" placeholder="Enter a valid email address" required>

        <label class="form-label">Password:</label>
        <input type="password" id="password" class="form-control mb-2" required>

        <label class="form-label">Confirm Password:</label>
        <input type="password" id="confirmPassword" class="form-control mb-2" required>

        <button class="btn btn-primary" type="submit">Register</button>
    </form>

    <small>Already User? <a href="login.html">Login</a></small>
</div>

<script>
document.querySelector("form").addEventListener("submit", function(e) {
    if (document.getElementById("password").value !==
        document.getElementById("confirmPassword").value) {
        e.preventDefault();
        alert("Passwords do not match!");
    }
});
</script>

</body>
</html>
